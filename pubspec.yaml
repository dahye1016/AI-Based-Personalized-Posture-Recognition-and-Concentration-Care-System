name: mlkit_pose
description: "PostureCare - 스마트 의자 자세 분석 & 집중력 케어 앱"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_blue_plus: ^2.3.8
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    # 배민 한나체 Pro — 제목·숫자용 (app_theme.dart 의 kDisplayFont)
    # 제공: 우아한형제들 / 디자인: 산돌커뮤니케이션
    - family: BMHANNA
      fonts:
        - asset: assets/fonts/BMHANNAPro.ttf
